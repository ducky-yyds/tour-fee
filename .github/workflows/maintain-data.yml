name: Daily source availability report

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Check a rotating sample without changing canonical data
        run: node scripts/check-source-health.mjs
      - name: Retain diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: source-availability
          path: artifacts/source-health/report.json
          retention-days: 30
