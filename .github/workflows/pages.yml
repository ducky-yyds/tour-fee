name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh public data before publishing
        type: boolean
        default: true
      run_tests:
        description: Run application tests before publishing
        type: boolean
        default: true
  workflow_call:
    inputs:
      refresh_data:
        type: boolean
        default: false
      run_tests:
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTO_UPDATE: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        if: ${{ (github.event_name == 'push' || inputs.run_tests) && !contains(github.event.head_commit.message, '[skip tests]') }}
        env:
          TRAVEL_DB_PATH: ':memory:'
        run: npm test
      - name: Restore last public source snapshots
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/tusuan-pages.sqlite
            ${{ runner.temp }}/tusuan-pages.sqlite-wal
            ${{ runner.temp }}/tusuan-pages.sqlite-shm
            data/airports.json
            data/airport-cities.json
            data/airport-maintenance.json
            data/experience-audit.json
            artifacts/place-library-cache
            artifacts/stay-library-cache
          key: tusuan-public-sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tusuan-public-sources-v1-
      - name: Refresh public data, retaining previous values on source failure
        id: update
        if: ${{ inputs.refresh_data || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip refresh]')) }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          # Cache only public-source snapshots, never the user's local database.
          TRAVEL_DB_PATH: ${{ runner.temp }}/tusuan-pages.sqlite
        run: npm run update:data
      - name: Explain partial source update
        if: steps.update.outcome == 'failure'
        run: echo '::warning::Some public sources could not be refreshed. Valid cached snapshots or dated reference values will be published; source status remains visible.'
      - name: Maintain nearby places within the daily request allowance
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/update-place-library.py --max-requests=${{ inputs.refresh_data && '6' || '0' }} --delay=5
      - name: Import maintained destinations and local places
        run: npm run import:destinations
      - name: Maintain named stays within the daily request allowance
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/update-stay-library.py --max-requests=${{ inputs.refresh_data && '6' || '0' }} --delay=5
      - name: Repair missing reviewed food and hotel photographs
        if: inputs.refresh_data
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/maintain-reviewed-images.py
      - name: Fill new card images from bundled illustrations
        # Subject-specific food art is bundled and never needs generation in CI.
        run: python3 scripts/complete-media.py --phase=fallback
      - name: Validate maintained catalog and bundled image references
        run: npm run audit:catalog
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Export public snapshots and build static app
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || steps.pages.outputs.base_path }}
          TRAVEL_DB_PATH: ${{ runner.temp }}/tusuan-pages.sqlite
        run: npm run build:pages
      - name: Cache public maintenance results
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/tusuan-pages.sqlite
            ${{ runner.temp }}/tusuan-pages.sqlite-wal
            ${{ runner.temp }}/tusuan-pages.sqlite-shm
            data/airports.json
            data/airport-cities.json
            data/airport-maintenance.json
            data/experience-audit.json
            artifacts/place-library-cache
            artifacts/stay-library-cache
          key: tusuan-public-sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload only the static build
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
