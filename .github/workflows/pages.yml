name: Build and deploy preview

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run application tests explicitly
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_tests:
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTO_UPDATE: '0'
      TRAVEL_DB_PATH: ':memory:'
    steps:
      - name: Check out archived public content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Python for preview image copies
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-maintenance.txt
      - name: Install pinned image optimizer dependencies
        run: python -m pip install -r requirements-maintenance.txt
      - name: Run explicitly requested application tests
        if: inputs.run_tests
        run: npm test
      - name: Assemble maintained source packages
        run: npm run import:destinations
      - name: Validate public catalog and bundled images
        run: npm run audit:catalog
      - name: Configure Pages preview
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build preview from versioned data
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || steps.pages.outputs.base_path }}
        run: npm run build:pages
      - name: Upload preview only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
